        // Clean date formatter e.g. "2026-10-01" -> "Oct 2026"
        function formatDate(str) {
            if (!str) return '';
            const parts = str.trim().split('-');
            const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
            if (parts.length === 1) return parts[0];
            const year = parts[0];
            const monthIdx = parseInt(parts[1], 10) - 1;
            if (monthIdx >= 0 && monthIdx < 12) {
                return `${months[monthIdx]} ${year}`;
            }
            return str;
        }

        // --- MAIN APP COMPONENT ---
        function App() {
            const [data, setData] = useState(null);
            const [loading, setLoading] = useState(true);
            const [error, setError] = useState(null);
            const [darkMode, setDarkMode] = useState(() => {
                if (typeof window !== 'undefined') {
                    const saved = localStorage.getItem('theme');
                    if (saved) return saved === 'dark';
                    return window.matchMedia('(prefers-color-scheme: dark)').matches;
                }
                return false;
            });
            const [copied, setCopied] = useState(false);
            const [expFilter, setExpFilter] = useState('tech'); // 'tech' or 'all'
            const [openProjects, setOpenProjects] = useState({});
            const [openExps, setOpenExps] = useState({});
            const [selectedSkill, setSelectedSkill] = useState(null);
            const [showFloatingNav, setShowFloatingNav] = useState(false);
            const [isCmdOpen, setIsCmdOpen] = useState(false);
            const [cmdQuery, setCmdQuery] = useState('');
            const [cmdIndex, setCmdIndex] = useState(0);
            const [duhokTime, setDuhokTime] = useState('');
            const [viewCount, setViewCount] = useState(null);
            const [todayCount, setTodayCount] = useState(null);

            const cmdInputRef = useRef(null);

            // Fetch all data dynamically from data.json
            useEffect(() => {
                fetch('./data.json')
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}: Failed to load data.json`);
                        return res.json();
                    })
                    .then(json => {
                        setData(json);
                        setLoading(false);
                    })
                    .catch(err => {
                        console.error('Failed to load data.json:', err);
                        setError(err.message || 'Error loading data.json');
                        setLoading(false);
                    });
            }, []);

            // Public zero-infrastructure page view counter via hitscounter.dev
            useEffect(() => {
                const targetUrl = 'https://salah.alsilevanai.com';
                const encodedUrl = encodeURIComponent(targetUrl);
                const isRecorded = sessionStorage.getItem('portfolio_hit_recorded');

                // If hit was already counted in this session, fetch latest totals without re-incrementing
                const endpoint = isRecorded
                    ? `https://hitscounter.dev/api/history?url=${encodedUrl}`
                    : `https://hitscounter.dev/api/hit?url=${encodedUrl}&output=json`;

                fetch(endpoint)
                    .then(res => {
                        if (!res.ok) throw new Error(`HTTP ${res.status}: Failed to fetch view count`);
                        return res.json();
                    })
                    .then(json => {
                        if (json && typeof json.total_hits === 'number') {
                            setViewCount(json.total_hits);
                            if (typeof json.today_hits === 'number') {
                                setTodayCount(json.today_hits);
                            }
                            sessionStorage.setItem('portfolio_hit_recorded', 'true');
                        }
                    })
                    .catch(err => {
                        // Silently handle ad-blocker / offline scenarios without UI impact
                        console.debug('Page view counter unavailable:', err);
                    });
            }, []);

            // Dynamically sync document title and meta tags with data.json
            useEffect(() => {
                if (!data) return;
                if (data.name && data.title) {
                    document.title = `${data.name} — ${data.title}`;
                }
                const descMeta = document.querySelector('meta[name="description"]');
                if (descMeta && data.short_bio) {
                    descMeta.setAttribute('content', data.short_bio);
                }
                const ogTitle = document.querySelector('meta[property="og:title"]');
                if (ogTitle && data.name) ogTitle.setAttribute('content', `${data.name} — ${data.title}`);
                const ogDesc = document.querySelector('meta[property="og:description"]');
                if (ogDesc && data.short_bio) ogDesc.setAttribute('content', data.short_bio);
                const twTitle = document.querySelector('meta[name="twitter:title"]');
                if (twTitle && data.name) twTitle.setAttribute('content', `${data.name} — ${data.title}`);
                const twDesc = document.querySelector('meta[name="twitter:description"]');
                if (twDesc && data.short_bio) twDesc.setAttribute('content', data.short_bio);
            }, [data]);

            // Synchronize dark mode, local storage, and dynamic SVG favicon
            useEffect(() => {
                const root = document.documentElement;
                const favicon = document.getElementById('dynamic-favicon');
                if (darkMode) {
                    root.classList.add('dark');
                    localStorage.setItem('theme', 'dark');
                    if (favicon) {
                        favicon.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%2309090b'/><text x='16' y='21' font-family='sans-serif' font-size='13' font-weight='700' fill='%23fafaf9' text-anchor='middle'>SA</text></svg>";
                    }
                } else {
                    root.classList.remove('dark');
                    localStorage.setItem('theme', 'light');
                    if (favicon) {
                        favicon.href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%23fafaf9' stroke='%2327272a' stroke-width='2'/><text x='16' y='21' font-family='sans-serif' font-size='13' font-weight='700' fill='%2309090b' text-anchor='middle'>SA</text></svg>";
                    }
                }
            }, [darkMode]);

            // Live Local Time Clock based on data.timezone
            useEffect(() => {
                const updateClock = () => {
                    try {
                        const now = new Date();
                        const timeString = new Intl.DateTimeFormat('en-US', {
                            timeZone: data?.timezone || 'Asia/Baghdad',
                            hour: 'numeric',
                            minute: '2-digit',
                            second: '2-digit',
                            hour12: true
                        }).format(now);
                        setDuhokTime(timeString);
                    } catch (e) {
                        setDuhokTime('');
                    }
                };
                updateClock();
                const interval = setInterval(updateClock, 1000);
                return () => clearInterval(interval);
            }, [data]);

            // Scroll listener for floating navigation island
            useEffect(() => {
                const handleScroll = () => {
                    if (window.scrollY > 160) {
                        setShowFloatingNav(true);
                    } else {
                        setShowFloatingNav(false);
                    }
                };
                window.addEventListener('scroll', handleScroll, { passive: true });
                return () => window.removeEventListener('scroll', handleScroll);
            }, []);

            // Global Keyboard Shortcut: Cmd+K / Ctrl+K & Escape
            useEffect(() => {
                const handleKeyDown = (e) => {
                    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') {
                        e.preventDefault();
                        setIsCmdOpen(prev => !prev);
                    } else if (e.key === 'Escape') {
                        if (isCmdOpen) {
                            setIsCmdOpen(false);
                        } else if (selectedSkill) {
                            setSelectedSkill(null);
                        }
                    }
                };
                window.addEventListener('keydown', handleKeyDown);
                return () => window.removeEventListener('keydown', handleKeyDown);
            }, [isCmdOpen, selectedSkill]);

            // Focus search input when Command Palette opens
            useEffect(() => {
                if (isCmdOpen) {
                    setCmdQuery('');
                    setCmdIndex(0);
                    setTimeout(() => {
                        if (cmdInputRef.current) cmdInputRef.current.focus();
                    }, 50);
                }
            }, [isCmdOpen]);

            const copyEmail = () => {
                if (!data?.email) return;
                navigator.clipboard.writeText(data.email).then(() => {
                    setCopied(true);
                    setTimeout(() => setCopied(false), 2400);
                });
            };

            const toggleProject = (index) => {
                setOpenProjects(prev => ({ ...prev, [index]: !prev[index] }));
            };

            const toggleExp = (index) => {
                setOpenExps(prev => ({ ...prev, [index]: !prev[index] }));
            };

            const handleSkillClick = (skill) => {
                if (selectedSkill === skill) {
                    setSelectedSkill(null);
                } else {
                    setSelectedSkill(skill);
                    // Automatically scroll smoothly toward projects if selecting a skill
                    const projEl = document.getElementById('projects-section');
                    if (projEl) {
                        projEl.scrollIntoView({ behavior: 'smooth', block: 'start' });
                    }
                }
            };

            // Download Contact vCard dynamically from data
            const downloadVCard = () => {
                if (!data) return;
                const nameParts = (data.name || '').trim().split(' ');
                const lastName = nameParts.length > 1 ? nameParts[nameParts.length - 1] : '';
                const firstName = nameParts.length > 1 ? nameParts.slice(0, -1).join(' ') : (data.name || '');
                const website = data.website || window.location.origin;
                const vcardContent = [
                    'BEGIN:VCARD',
                    'VERSION:3.0',
                    `FN:${data.name || ''}`,
                    `N:${lastName};${firstName};;;`,
                    `TITLE:${data.title || ''}`,
                    `EMAIL;TYPE=INTERNET,PREF:${data.email || ''}`,
                    `URL:${website}`,
                    `ADR;TYPE=WORK:;;${data.location || ''};;;;`,
                    `NOTE:${data.short_bio || data.title || ''}`,
                    'END:VCARD'
                ].join('\n');

                const blob = new Blob([vcardContent], { type: 'text/vcard;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `${(data.name || 'contact').replace(/\s+/g, '-')}.vcf`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            };

            const printCV = () => {
                window.print();
            };

            // Normalize work experience
            const allExperiences = useMemo(() => {
                if (!data?.work_experience) return [];
                return data.work_experience.flatMap(item => {
                    if (item.work_experience && Array.isArray(item.work_experience)) {
                        return item.work_experience;
                    }
                    return [item];
                });
            }, [data]);

            // Filtered experiences by type
            const filteredExperiences = useMemo(() => {
                let base = allExperiences;
                if (expFilter === 'tech') {
                    const technicalKeywords = ['developer', 'engineer', 'cctv', 'partner', 'it assistant', 'solutions'];
                    base = base.filter(item => {
                        const title = (item.title || '').toLowerCase();
                        const comp = (item.company || '').toLowerCase();
                        return technicalKeywords.some(kw => title.includes(kw) || comp.includes(kw));
                    });
                }
                return base;
            }, [allExperiences, expFilter]);

            // All unique skills for discovery
            const allSkills = useMemo(() => {
                const s = new Set();
                (data?.projects || []).forEach(p => (p.tech_stack || []).forEach(t => s.add(t)));
                allExperiences.forEach(e => (e.skills || []).forEach(sk => s.add(sk)));
                return Array.from(s).sort();
            }, [data, allExperiences]);

            // Command Palette Search Results
            const cmdResults = useMemo(() => {
                const q = cmdQuery.trim().toLowerCase();
                const results = [];

                // Navigation actions
                const navItems = [
                    { label: 'Jump to: Selected Projects', action: () => { document.getElementById('projects-section')?.scrollIntoView({ behavior: 'smooth' }); setIsCmdOpen(false); }, category: 'Navigation' },
                    { label: 'Jump to: Work Experience', action: () => { document.getElementById('experience-section')?.scrollIntoView({ behavior: 'smooth' }); setIsCmdOpen(false); }, category: 'Navigation' },
                    { label: 'Jump to: Technical Toolkit', action: () => { document.getElementById('toolkit-section')?.scrollIntoView({ behavior: 'smooth' }); setIsCmdOpen(false); }, category: 'Navigation' },
                    { label: 'Jump to: Education & Credentials', action: () => { document.getElementById('education-section')?.scrollIntoView({ behavior: 'smooth' }); setIsCmdOpen(false); }, category: 'Navigation' },
                    { label: 'Jump to: Contact Section', action: () => { document.getElementById('contact-section')?.scrollIntoView({ behavior: 'smooth' }); setIsCmdOpen(false); }, category: 'Navigation' }
                ];

                // Core Quick Actions
                const actionItems = [
                    { label: `Copy Email (${data?.email})`, action: () => { copyEmail(); setIsCmdOpen(false); }, category: 'Action' },
                    { label: 'Download Contact Card (.vcf)', action: () => { downloadVCard(); setIsCmdOpen(false); }, category: 'Action' },
                    { label: 'Print / Save PDF Resume', action: () => { setIsCmdOpen(false); setTimeout(printCV, 300); }, category: 'Action' },
                    { label: `Switch to ${darkMode ? 'Light' : 'Dark'} Mode`, action: () => { setDarkMode(!darkMode); setIsCmdOpen(false); }, category: 'Action' }
                ];

                if (!q) {
                    return [...actionItems, ...navItems];
                }

                // Filter Actions & Nav
                [...actionItems, ...navItems].forEach(item => {
                    if (item.label.toLowerCase().includes(q)) results.push(item);
                });

                // Filter Projects
                (data?.projects || []).forEach(p => {
                    if (p.name.toLowerCase().includes(q) || (p.subtitle && p.subtitle.toLowerCase().includes(q)) || (p.tech_stack || []).some(t => t.toLowerCase().includes(q))) {
                        results.push({
                            label: `Project: ${p.name} (${p.year})`,
                            sub: p.subtitle,
                            action: () => {
                                document.getElementById('projects-section')?.scrollIntoView({ behavior: 'smooth' });
                                setIsCmdOpen(false);
                            },
                            category: 'Projects'
                        });
                    }
                });

                // Filter Skills
                allSkills.forEach(skill => {
                    if (skill.toLowerCase().includes(q)) {
                        results.push({
                            label: `Filter by Skill: ${skill}`,
                            action: () => {
                                handleSkillClick(skill);
                                setIsCmdOpen(false);
                            },
                            category: 'Skills'
                        });
                    }
                });

                return results;
            }, [cmdQuery, data, darkMode, allSkills]);

            // Keyboard navigation in Command Palette
            const handleCmdKeyDown = (e) => {
                if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    setCmdIndex(prev => (prev + 1) % (cmdResults.length || 1));
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    setCmdIndex(prev => (prev - 1 + cmdResults.length) % (cmdResults.length || 1));
                } else if (e.key === 'Enter') {
                    e.preventDefault();
                    if (cmdResults[cmdIndex]) {

            if (loading) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center font-mono text-xs text-zinc-500 gap-3">
                        <div className="w-5 h-5 border-2 border-zinc-300 dark:border-zinc-700 border-t-zinc-900 dark:border-t-zinc-100 rounded-full animate-spin" />
                        <span>Loading from data.json...</span>
                    </div>

            if (error || !data) {
                return (
                    <div className="min-h-screen flex flex-col items-center justify-center font-mono text-xs text-zinc-500 p-6 text-center space-y-3">

                        <p className="max-w-md text-zinc-400">

            return (
                <div className="min-h-screen text-zinc-800 dark:text-zinc-200 antialiased selection:bg-zinc-200 dark:selection:bg-zinc-800 relative">

                        <nav className="backdrop-blur-md bg-[#fafaf9]/85 dark:bg-[#09090b]/85 border border-zinc-200/80 dark:border-zinc-800/80 shadow-md rounded-full px-3 py-1.5 flex items-center gap-1 sm:gap-2 text-xs font-mono">
                            <button

                            >
                                Projects
                            </button>
                            <button
                                onClick={() => document.getElementById('experience-section')?.scrollIntoView({ behavior: 'smooth' })}

                                <span className="inline-flex items-center gap-1.5">
                                    <span className="text-[11px] leading-none">⌘</span>

                                </span>
                            </button>
                        </nav>
                    </div>

                    {/* --- COMMAND PALETTE OVERLAY (Cmd+K / Ctrl+K) --- */}
                    {isCmdOpen && (

                            <div

                            >
                                {/* Search Input */}

                                    <IconSearch className="w-4 h-4 text-zinc-400" />

                                    <button

                                        <IconX className="w-3.5 h-3.5" />

                                {/* Results List */}
                                <div className="max-h-80 overflow-y-auto py-2 divide-y divide-zinc-100 dark:divide-zinc-800/50">
                                    {cmdResults.length === 0 ? (

                                            >
                                                <div className="flex items-center gap-2.5 truncate">
                                                    <span className="text-[10px] font-mono uppercase tracking-wider text-zinc-400 dark:text-zinc-500 w-16 shrink-0">

                                                    <span className="font-medium truncate">{item.label}</span>
                                                </div>
                                                <span className="text-[10px] font-mono text-zinc-400 dark:text-zinc-500 shrink-0 ml-2">
                                                    {idx === cmdIndex ? '↵' : ''}
                                                </span>
                                            </div>
                                        ))
                                    )}
                                </div>

                                {/* Keyboard Footer */}
                                <div className="px-4 py-2 border-t border-zinc-200 dark:border-zinc-800 bg-zinc-50/70 dark:bg-zinc-900/40 flex items-center justify-between text-[11px] font-mono text-zinc-400">
                                    <div className="flex items-center gap-3">
                                        <span>↑↓ Navigate</span>
                                        <span>↵ Select</span>
                                        <span>esc Close</span>
                                    </div>
                                    <span>Press <span className="inline-flex items-center gap-1 font-mono"><span>⌘</span><span>K</span></span> anytime</span>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* Toast Notification */}
                    <div className={`fixed bottom-6 right-6 z-50 transition-all duration-300 transform no-print ${
                        copied ? 'opacity-100 translate-y-0' : 'opacity-0 translate-y-3 pointer-events-none'
                    }`}>
                        <div className="bg-zinc-900 text-zinc-100 dark:bg-zinc-100 dark:text-zinc-900 px-4 py-2.5 rounded-lg shadow-xl font-mono text-xs flex items-center gap-2 border border-zinc-700 dark:border-zinc-300">
                            <IconCheck className="w-4 h-4 text-emerald-400 dark:text-emerald-600" />
                            <span>Copied <strong>{data.email}</strong> to clipboard</span>
                        </div>
                    </div>

                    {/* Page Container */}
                    <main className="max-w-2xl mx-auto px-6 py-14 sm:py-20 md:py-24 space-y-16 sm:space-y-20">

                        {/* --- TOP BAR / MINIMAL HEADER --- */}
                        <header className="flex items-start justify-between gap-4">
                            <div className="flex items-center gap-4 sm:gap-5">
                                {/* Profile Picture / Avatar */}
                                <div className="relative group shrink-0">
                                    <div className="w-14 h-14 sm:w-16 sm:h-16 rounded-full overflow-hidden border border-zinc-200 dark:border-zinc-800 bg-zinc-100 dark:bg-zinc-900">
                                        <img
                                            src={data.avatar || "static/pictures/selfie.jpeg"}
                                            alt={data.name}
                                            className="w-full h-full object-cover grayscale contrast-105 group-hover:grayscale-0 transition-all duration-300"
                                            onError={(e) => {
                                                e.target.style.display = 'none';
                                                e.target.parentElement.innerHTML = '<div class="w-full h-full flex items-center justify-center font-mono font-medium text-sm text-zinc-500">SA</div>';
                                            }}

                                    </div>
                                    <span className="absolute bottom-0 right-0 w-3.5 h-3.5 bg-emerald-500 border-2 border-[#fafaf9] dark:border-[#09090b] rounded-full no-print" title="Active & Available" />
                                </div>

                                <div>
                                    <h1 className="text-lg sm:text-xl font-medium tracking-tight text-zinc-950 dark:text-white">
                                        {data.name}

                                        {data.title}

                                            <IconMapPin className="w-3 h-3 text-zinc-400 dark:text-zinc-500" />
                                            <span>{data.location}</span>
                                        </div>
                                        {duhokTime && (
                                            <>
                                                <span>·</span>
                                                <span className="text-zinc-500 dark:text-zinc-400" title={`Local Time in ${data.location}`}>
                                                    {duhokTime} ({data.timezone_label || 'UTC+3'})
                                                </span>
                                            </>
                                        )}
                                        {viewCount !== null && (
                                            <>
                                                <span className="no-print">·</span>
                                                <div
                                                    className="inline-flex items-center gap-1 text-zinc-500 dark:text-zinc-400 no-print"
                                                    title={`${viewCount.toLocaleString()} total views${todayCount !== null ? ` (${todayCount.toLocaleString()} today)` : ''}`}

                                                    <IconEye className="w-3 h-3 text-zinc-400 dark:text-zinc-500" />
                                                    <span>{viewCount.toLocaleString()} views</span>
                                                </div>
                                            </>
                                        )}

                                </div>
                            </div>

                            {/* Header Actions: Print, Search, Theme Toggle */}
                            <div className="flex items-center gap-1.5 pt-1 no-print">

                                    className="p-2 rounded-lg text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-zinc-100 hover:bg-zinc-100 dark:hover:bg-zinc-900 transition-colors"

                                        onClick={(e) => {
                                            e.preventDefault();
                                            window.scrollTo({ top: 0, behavior: 'smooth' });
                                        }}
                                        className="hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors"
                                    >
                                        Top ↑
                                    </a>
                                </div>
                            </footer>
                        </section>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
