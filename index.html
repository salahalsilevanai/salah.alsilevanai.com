            if (parts.length === 1) return parts[0];
            const year = parts[0];
            const monthIdx = parseInt(parts[1], 10) - 1;
            if (monthIdx >= 0 && monthIdx < 12) {
                return `${months[monthIdx]} ${year}`;
            }
            return str;

                    if (item.label.toLowerCase().includes(q)) results.push(item);

                // Filter Projects
                (data?.projects || []).forEach(p => {
                    if (p.name.toLowerCase().includes(q) || (p.subtitle && p.subtitle.toLowerCase().includes(q)) || (p.tech_stack || []).some(t => t.toLowerCase().includes(q))) {

                            action: () => {

                            label: `Filter by Skill: ${skill}`,
                            action: () => {
                                handleSkillClick(skill);
                                setIsCmdOpen(false);
                            },
                            category: 'Skills'
                        });
                    }
                });

                return results;

                                    <a

                                        className="inline-flex items-center gap-2 px-4 py-2 rounded-lg bg-zinc-950 dark:bg-zinc-100 text-white dark:text-zinc-950 text-xs font-mono font-medium hover:opacity-90 transition-opacity"
                                    >
                                        <IconMail className="w-3.5 h-3.5" />
                                        <span>Send an Email</span>
                                    </a>

                                    <button
                                        onClick={copyEmail}
                                        className="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-800 dark:text-zinc-200 text-xs font-mono transition-colors"
                                    >
                                        <IconCopy className="w-3.5 h-3.5" />
                                        <span>Copy Address</span>
                                    </button>

                                    <button
                                        onClick={downloadVCard}
                                        className="inline-flex items-center gap-2 px-4 py-2 rounded-lg border border-zinc-200 dark:border-zinc-800 hover:bg-zinc-100 dark:hover:bg-zinc-800 text-zinc-800 dark:text-zinc-200 text-xs font-mono transition-colors"
                                    >
                                        <IconDownload className="w-3.5 h-3.5" />
                                        <span>Save vCard</span>
                                    </button>
                                </div>
                            </div>

                            {/* Minimalist Footer */}
                            <footer className="pt-6 border-t border-zinc-200/60 dark:border-zinc-800/60 flex flex-col sm:flex-row items-center justify-between gap-3 text-xs font-mono text-zinc-400 dark:text-zinc-500">
                                <div>
                                    © 2026 {data.name} · Built with React & Tailwind CSS
                                </div>
                                <div className="flex items-center gap-4 no-print">
                                    <span>Duhok, Kurdistan (UTC+3)</span>
                                    <button
                                        onClick={() => setIsCmdOpen(true)}
                                        className="hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors inline-flex items-center gap-1.5"
                                    >
                                        <span className="inline-flex items-center gap-1">
                                            <span>⌘</span>
                                            <span>K</span>
                                        </span>
                                        <span>Search</span>
                                    </button>
                                    <a
                                        href="#"
                                        onClick={(e) => {
                                            e.preventDefault();
                                            window.scrollTo({ top: 0, behavior: 'smooth' });
                                        }}
                                        className="hover:text-zinc-900 dark:hover:text-zinc-100 transition-colors"
                                    >
                                        Top ↑
                                    </a>
                                </div>
                            </footer>
                        </section>

                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
